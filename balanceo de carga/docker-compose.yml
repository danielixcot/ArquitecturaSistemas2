services:
  web1:
    image: nginx:alpine
    container_name: web1
    volumes:
      - ./server1/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - labnet

  web2:
    image: nginx:alpine
    container_name: web2
    volumes:
      - ./server2/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - labnet

  lb:
    image: nginx:alpine
    container_name: lb
    ports:
      - "8080:80"
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
